linters:
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet issues
    - staticcheck    # comprehensive static analysis
    - unused         # unused code
    - gosimple       # simplifications
    - ineffassign    # useless assignments
    - goimports      # import ordering
    - misspell       # spelling in comments/strings
    - errorlint      # errors.Is/As correctness, %w wrapping
    - unconvert      # unnecessary type conversions
    - gocritic       # opinionated but useful diagnostics

linters-settings:
  goimports:
    local-prefixes: github.com/j0lvera
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
