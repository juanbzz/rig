version: "2"

linters:
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet issues
    - staticcheck    # comprehensive static analysis, gosimple included
    - unused         # unused code
    - ineffassign    # useless assignments
    - misspell       # spelling in comments/strings
    - errorlint      # errors.Is/As correctness, %w wrapping
    - unconvert      # unnecessary type conversions
    - gocritic       # opinionated but useful diagnostics
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
  exclusions:
    # v1's default exclusions: unchecked Close, Fprint*, Setenv and the like.
    presets:
      - std-error-handling

formatters:
  enable:
    - goimports      # import ordering
  settings:
    goimports:
      local-prefixes:
        - github.com/juanbzz

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
